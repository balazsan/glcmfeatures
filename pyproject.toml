[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glcmfeatures"
version = "0.1.0"
description = "Core GLCM texture features (Hall-Beyer 2017 subset) built on scikit-image"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
    "scikit-image>=0.19",
]

[tool.setuptools.packages.find]
where = ["src"]
